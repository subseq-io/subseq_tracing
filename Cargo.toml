[package]
name = "subseq_tracing"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Client-first diagnostics capture with scoped events, panic hooks, tracing, and OpenTelemetry context"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
base64 = "0.22.1"
once_cell = "1.21.3"
opentelemetry = "0.28.0"
rustls = { version = "0.23.36", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.29.0"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
ureq = { version = "2.12.1", features = ["json"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
webpki-roots = "0.26.11"

[dev-dependencies]
anyhow = "1.0"
rcgen = "0.14.4"
serial_test = "3.2.0"
